server:
  port: 8081

spring:
  application:
    name: booking-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/userdb}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:rootpassword}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  # Spring Boot 3부터 Redis 설정은 spring.data.redis 하위에 위치 (spring.redis는 무시됨)
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:}

  session:
    store-type: none

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    # 로컬 개발: localhost:9092 / Docker Compose: kafka:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        retry.backoff.ms: 1000
    consumer:
      group-id: booking-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # ErrorHandlingDeserializer가 실제 역직렬화를 JsonDeserializer에 위임하고, 실패하면 예외를 리스너 에러로 넘긴다.
      # 이 래퍼가 없으면 깨진 메시지(poison pill)가 poll 단계에서 계속 실패해 컨슈머가 무한 루프에 빠진다.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        # 역직렬화를 허용할 이벤트 패키지 (구독하는 이벤트 클래스의 패키지를 모두 포함해야 함)
        spring.json.trusted.packages: com.domain.booking.event,com.domain.payment.event
      enable-auto-commit: false
    listener:
      ack-mode: manual_immediate

app:
  jwt:
    secret: ${JWT_SECRET:c3BhcnRhLW1zYS1ob3RlbC1ib29raW5nLXNlcnZpY2Utand0LXNlY3JldC1rZXktMjAyNg==}
    access-token-expiration: 1800000
    refresh-token-expiration: 604800000
  kafka:
    topics:
      booking-events: booking-events
      payment-completed-events: payment-completed-events

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.domain.booking: DEBUG
